{% extends "base.html" %}
{% block title %}Sign Up | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Create your account</h2>
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/form_fields.html" %}
                    <button type="submit" class="btn btn-success w-100">Sign Up</button>
                </form>
                <p class="mt-3 mb-0 text-center small">Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
