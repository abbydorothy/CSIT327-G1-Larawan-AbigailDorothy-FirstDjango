{% extends "base.html" %}
{% block title %}Login | CampusConnect{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Login</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
                                   class="form-control" required {% if field.value %}value="{{ field.value }}"{% endif %}>
                        </div>
                    {% endfor %}
                    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
                    <button type="submit" class="btn btn-success w-100">Login</button>
                </form>
                <p class="mt-3 mb-0 text-center small">Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
